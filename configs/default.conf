# webserv - configuration d'exemple
# demontre virtual hosts, heritage server->location, methods, autoindex,
# upload, cgi, redirection, error_page

server {
	listen 8080;
	server_name localhost;
	root ./www;
	index index.html index.htm;
	client_max_body_size 1m;
	error_page 404 /errors/404.html;
	error_page 500 502 503 /errors/5xx.html;

	location / {
		methods GET;
		autoindex off;
	}

	location /uploads {
		methods GET POST DELETE;
		root ./www/uploads;
		autoindex on;
		client_max_body_size 10m;
		upload_store ./www/uploads;
	}

	location /cgi-bin {
		methods GET POST;
		root ./www/cgi-bin;
		cgi .cgi;
		cgi .py /usr/bin/python3;
		cgi .php /usr/bin/php-cgi;
	}

	location /old {
		return 301 http://localhost:8080/;
	}
}

server {
	listen 8080;
	server_name site-b.local;
	root ./www-b;

	location / {
		methods GET;
	}
}

server {
	listen 9090;
	root ./www;

	location / {
		autoindex on;
	}
}
